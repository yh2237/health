<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health Monitor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Health Monitor</h1>
      <p class="subtitle">死活監視</p>
    </div>
    <div class="controls">
      <div class="control-group">
        <label>バケット:</label>
        <div class="segmented" id="bucketToggle">
          <button data-bucket="30">30分</button>
          <button data-bucket="60" class="active">1時間</button>
        </div>
      </div>
      <div class="control-group">
        <label>期間:</label>
        <div class="segmented" id="daysToggle">
          <button data-days="7">7日</button>
          <button data-days="30">30日</button>
          <button data-days="90" class="active">90日</button>
        </div>
      </div>
      <button id="refreshBtn" class="btn">更新</button>
      <span id="lastUpdated" class="last-updated"></span>
    </div>
  </header>

  <main class="main">
    <div id="services" class="services"></div>
    <div id="loading" class="loading">読み込み中...</div>
  </main>

  <div class="legend">
    <span class="legend-item"><span class="box legend-box up"></span> 正常</span>
    <span class="legend-item"><span class="box legend-box degraded"></span> 部分障害</span>
    <span class="legend-item"><span class="box legend-box down"></span> 障害</span>
    <span class="legend-item"><span class="box legend-box nodata"></span> データなし</span>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <footer class="footer">
    <small>Cloudflare Workers + KV / Cron (5分間隔) / Tunnelエラーページ検知対応</small>
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
